# Throwaway local Supabase stack for the browser tests. Own project id and
# ports so it never collides with a developer's everyday `supabase start`.
project_id = "thehumancode-e2e"

[api]
enabled = true
port = 54421

[db]
port = 54422
shadow_port = 54420
major_version = 15

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
